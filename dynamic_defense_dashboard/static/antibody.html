<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>抗体泛化</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/antibody_generalization/antibody.css" />
  </head>
  <body data-page="antibody">
    <script>if (new URLSearchParams(window.location.search).get("embed") === "1") document.body.dataset.embed = "true";</script>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">DYNAMIC DEFENSE</span>
          <h1>抗体泛化</h1>
        </div>
        <div class="topbar-actions">
          <a class="ghost-button text-link-button" id="antibodyTopOverviewLink" href="/">返回总览</a>
          <a class="ghost-button text-link-button" id="antibodyTopSectionLink" href="/?tab=antibody">返回模块</a>
        </div>
      </header>

      <main class="antibody-page-shell">
        <section class="panel detail-flow-strip antibody-flow-strip">
          <div class="detail-breadcrumb" id="antibodyBreadcrumb">总览 / 抗体泛化 / 动态演示</div>
          <div class="detail-nav-actions">
            <a class="ghost-button text-link-button" id="antibodyOverviewLink" href="/">返回总览</a>
            <a class="ghost-button text-link-button" id="antibodySectionLink" href="/?tab=antibody">返回模块</a>
          </div>
        </section>

        <section class="panel module-flow-strip module-flow-strip--compact">
          <article class="flow-step-card is-active">
            <span class="flow-step-index">01</span>
            <div>
              <strong>模式选择</strong>
              <p>在单模态与跨模态泛化之间切换当前演示链路。</p>
            </div>
          </article>
          <article class="flow-step-card">
            <span class="flow-step-index">02</span>
            <div>
              <strong>步骤执行</strong>
              <p>按既定步骤推进攻击记录、特征提取、生成与验证。</p>
            </div>
          </article>
          <article class="flow-step-card">
            <span class="flow-step-index">03</span>
            <div>
              <strong>结果研判</strong>
              <p>查看产物、关系推理和跨模态迁移结果。</p>
            </div>
          </article>
        </section>

        <section class="panel module-intro-panel antibody-main-panel">
          <div class="stage-header">
            <div>
              <p class="stage-kicker">ANTIBODY GENERALIZATION</p>
              <h2>抗体泛化动态演示</h2>
            </div>
          </div>
          <div id="antibodyDemoRoot" class="antibody-demo-root"></div>
        </section>
      </main>
    </div>

    <script src="/app.js" defer></script>
    <script src="/antibody_generalization/antibody.js" defer></script>
  </body>
</html>
