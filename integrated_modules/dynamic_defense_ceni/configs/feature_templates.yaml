# 如果没有 threat_templates.json，feature_analyzer.py 会优先基于带 Label 的 CICIDS CSV 自动训练模板。
# 若输入数据没有标签，则使用这里的启发式模板兜底。
feature_columns:
  - Flow Duration
  - Total Fwd Packets
  - Total Backward Packets
  - Total Length of Fwd Packets
  - Total Length of Bwd Packets
  - Fwd Packet Length Max
  - Bwd Packet Length Max
  - Flow Bytes/s
  - Flow Packets/s
  - SYN Flag Count
  - ACK Flag Count
  - Destination Port
heuristic_templates:
  DDoS:
    Flow Packets/s: high
    Total Fwd Packets: high
    Total Backward Packets: low
    SYN Flag Count: high
  PortScan:
    Flow Duration: low
    Destination Port: high_variance
    Total Fwd Packets: low
  SSH-Patator:
    Destination Port: 22
    Flow Packets/s: medium
  FTP-Patator:
    Destination Port: 21
    Flow Packets/s: medium
  Heartbleed:
    Destination Port: 443
    Total Length of Bwd Packets: high
  UNKNOWN:
    Flow Packets/s: medium
