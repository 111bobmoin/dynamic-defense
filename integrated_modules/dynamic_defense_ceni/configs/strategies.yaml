# 策略库示例：可按实验需要继续扩充。cost 越高表示部署代价越大。
strategies:
  - strategy_id: s_ddos_vote_rate_limit
    name: DDoS majority-vote + rate-limit
    model_type: ensemble
    attack_types: [DDoS, DoS Hulk, DoS GoldenEye, DoS slowloris, DoS Slowhttptest]
    priority: 90
    cost: 0.25
    actions:
      - type: switch_model
        target_model: ensemble_lstm_ar_subspace
      - type: raise_threshold
        metric: flow_rate
        value: 0.85
      - type: rate_limit
        scope: suspicious_src
        value: 20mbit

  - strategy_id: s_portscan_isolate
    name: PortScan isolate + log-enrich
    model_type: hybrid
    attack_types: [PortScan]
    priority: 80
    cost: 0.18
    actions:
      - type: switch_model
        target_model: subspace_detector
      - type: isolate_flow
        scope: suspicious_src_dst
      - type: log_enrich
        fields: [src_ip, dst_ip, dst_port, flow_duration]

  - strategy_id: s_bruteforce_ssh_ftp
    name: SSH/FTP brute-force adaptive detector
    model_type: sequence
    attack_types: [SSH-Patator, FTP-Patator, Brute Force]
    priority: 75
    cost: 0.15
    actions:
      - type: switch_model
        target_model: lstm_sequence_detector
      - type: raise_threshold
        metric: failed_login_rate
        value: 0.75
      - type: isolate_flow
        scope: suspicious_src

  - strategy_id: s_web_attack_strict
    name: Web attack strict policy
    model_type: web
    attack_types: [Web Attack, Web Attack Brute Force, Web Attack Sql Injection, Web Attack XSS]
    priority: 70
    cost: 0.20
    actions:
      - type: switch_model
        target_model: web_feature_detector
      - type: log_enrich
        fields: [uri, method, payload_len, status_code]

  - strategy_id: s_heartbleed_deep_inspection
    name: Heartbleed deep inspection
    model_type: protocol
    attack_types: [Heartbleed]
    priority: 85
    cost: 0.30
    actions:
      - type: switch_model
        target_model: protocol_signature_detector
      - type: isolate_flow
        scope: tls_heartbeat_flow

  - strategy_id: s_unknown_similarity
    name: Unknown threat similarity-based fallback
    model_type: fallback
    attack_types: [UNKNOWN]
    priority: 40
    cost: 0.10
    actions:
      - type: switch_model
        target_model: ensemble_lstm_ar_subspace
      - type: enable_vote
        voters: 3
      - type: log_enrich
        fields: [all_core_features]

  - strategy_id: s_benign_monitor
    name: Benign traffic monitor-only policy
    model_type: monitor
    attack_types: [BENIGN, NORMAL]
    priority: 30
    cost: 0.02
    actions:
      - type: monitor_only
        scope: baseline_window
      - type: log_enrich
        fields: [window_summary]

